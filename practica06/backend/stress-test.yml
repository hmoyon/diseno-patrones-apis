config:
  target: "http://localhost:3000"
  plugins:
    ensure: {}            # Falla el proceso si no se cumplen los SLA
  ensure:
    thresholds:
      - "http.response_time.p99": 200   # 99% de las transacciones en < 200 ms (comportamiento temporal)
    maxErrorRate: 1                     # Máximo 1% de errores de red/socket
  phases:
    - duration: 20
      arrivalRate: 5
      name: "1. Fase de Calentamiento (Tráfico Base)"
    - duration: 30
      arrivalRate: 15
      rampTo: 50
      name: "2. Fase de Saturación Máxima (Pico de Carga)"

scenarios:
  - name: "Inundación transaccional perimetral (Payloads Mixtos Zod)"
    flow:
      # Flujo A: datos correctos -> recorre toda la tubería (Zod -> Controller -> Repository -> MongoDB)
      - post:
          url: "/api/v1/employees"
          json:
            nombre: "Andrés Mendoza"
            cargo: "Software Architect"
            departamento: "I+D"
            sueldo: 4200
          capture:
            json: "$.data.id"           # nuestro repositorio devuelve "id" (no "_id")
            as: "employeeId"
      - think: 1
      # Flujo B: datos corruptos -> rechazo inmediato del DTO Zod (400)
      - post:
          url: "/api/v1/employees"
          json:
            nombre: "Al"
            cargo: "Dev"
            departamento: "TI"
            sueldo: -500
