<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th scope="col">Nombre</th>
        <th scope="col">Cargo</th>
        <th scope="col">Departamento</th>
        <th scope="col" class="num">Sueldo</th>
        <th scope="col" class="num">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let empleado of employees; trackBy: trackById"
          [class.editing]="empleado.id === selectedId">
        <td>
          <div class="person">
            <span class="avatar" aria-hidden="true">{{ initials(empleado.nombre) }}</span>
            <span class="name">{{ empleado.nombre }}</span>
          </div>
        </td>
        <td class="muted">{{ empleado.cargo }}</td>
        <td><span class="chip">{{ empleado.departamento }}</span></td>
        <td class="num mono">{{ empleado.sueldo | currency: 'USD' : 'symbol' : '1.2-2' }}</td>
        <td class="num actions">
          <ng-container *ngIf="confirmingId === empleado.id; else idle">
            <span class="confirm-text">¿Eliminar?</span>
            <button type="button" class="btn btn--danger btn--sm" (click)="confirmRemove(empleado)">Sí</button>
            <button type="button" class="btn btn--ghost btn--sm" (click)="cancelRemove()">No</button>
          </ng-container>
          <ng-template #idle>
            <button type="button" class="icon-btn icon-btn--primary"
                    [attr.aria-label]="'Editar a ' + empleado.nombre"
                    (click)="edit.emit(empleado)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M4 20h4L19 9l-4-4L4 16v4z"></path>
              </svg>
            </button>
            <button type="button" class="icon-btn icon-btn--danger"
                    [attr.aria-label]="'Eliminar a ' + empleado.nombre"
                    (click)="askRemove(empleado)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path>
              </svg>
            </button>
          </ng-template>
        </td>
      </tr>
    </tbody>
  </table>

  <p class="empty" *ngIf="employees.length === 0">{{ emptyMessage }}</p>
</div>
